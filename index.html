<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Virtual Nutrition Counselor</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1d2023; overflow: hidden; }
      #unity-container { position: absolute; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #1d2023; }
      #unity-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #d6d8da; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      #unity-progress { width: 240px; height: 6px; margin-top: 12px; border-radius: 3px; background: #3a3f44; overflow: hidden; }
      #unity-progress-full { width: 0; height: 100%; background: #8ec5ff; }
      #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); color: #fff; }
      #unity-warning div { background: #444; padding: 8px 12px; margin-bottom: 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div>Loading the virtual counselor ...</div>
        <div id="unity-progress"><div id="unity-progress-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFull = document.querySelector("#unity-progress-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style.background = "#b3261e";
        else setTimeout(function () { warningBanner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Yihang Jiao",
        productName: "Virtual Nutrition Counselor",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFull.style.width = 100 * progress + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
